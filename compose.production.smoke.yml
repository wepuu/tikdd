name: tikdd-wi16-smoke

services:
  postgres:
    volumes: !override
      - tikdd-smoke-postgres:/var/lib/postgresql/data
  redis:
    volumes: !override
      - tikdd-smoke-redis:/data
  worker:
    volumes: !override
      - tikdd-smoke-runtime:/run/tikdd:ro
  preflight:
    environment:
      TIKDD_INTERNAL_PREFLIGHT_SIGNALS_JSON: '{"postgresReady":false,"redisReady":false,"providerEgressReady":false,"cleanupLastSucceededAt":null,"evidenceLastSucceededAt":null,"emergencyDenyPropagationMs":null,"workerRestartFailClosed":false,"deliveryExpiryFailClosed":false,"manualRecoveryRequired":true}'
    volumes: !override
      - tikdd-smoke-runtime:/run/tikdd

volumes:
  tikdd-smoke-postgres: {}
  tikdd-smoke-redis: {}
  tikdd-smoke-runtime: {}
