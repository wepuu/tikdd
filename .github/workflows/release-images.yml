name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: service
            image: tikdd-release-service
          - target: web
            image: tikdd-release-web
          - target: admin
            image: tikdd-release-admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          tags: ghcr.io/wepuu/${{ matrix.image }}:git-${{ github.sha }}
          build-args: |
            TIKDD_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_BASE_URL=https://api.tikdd.cc
            NEXT_PUBLIC_DELIVERY_BASE_URL=https://dl.tikdd.cc
            SITE_URL=https://www.tikdd.cc
      - name: Record immutable identity
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/wepuu/${{ matrix.image }}:git-${{ github.sha }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
